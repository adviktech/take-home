<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#1A1D2E"/>

  <!-- Exhaust stack -->
  <rect x="64" y="15" width="5" height="13" rx="2" fill="#F59E0B"/>
  <!-- Exhaust puff -->
  <circle cx="66.5" cy="13" r="3" fill="#F59E0B" opacity="0.35"/>

  <!-- Trailer body -->
  <rect x="7" y="36" width="53" height="24" rx="3" fill="#F59E0B"/>
  <!-- Trailer rib lines -->
  <line x1="22" y1="37" x2="22" y2="59" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
  <line x1="37" y1="37" x2="37" y2="59" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
  <line x1="52" y1="37" x2="52" y2="59" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>

  <!-- Cab body -->
  <rect x="61" y="26" width="31" height="34" rx="4" fill="#F59E0B"/>

  <!-- Windshield (dark) -->
  <rect x="77" y="30" width="12" height="18" rx="2.5" fill="#0D0F1A" opacity="0.75"/>
  <!-- Side window -->
  <rect x="64" y="30" width="10" height="11" rx="2" fill="#0D0F1A" opacity="0.4"/>

  <!-- Front bumper -->
  <rect x="90" y="47" width="5" height="10" rx="1.5" fill="#D97706"/>
  <!-- Headlight -->
  <rect x="90" y="35" width="4" height="6" rx="1" fill="#FEF9C3" opacity="0.9"/>

  <!-- Wheels (rear trailer) -->
  <circle cx="21" cy="65" r="8.5" fill="#F59E0B"/>
  <circle cx="21" cy="65" r="4"   fill="#0D0F1A"/>
  <circle cx="21" cy="65" r="1.5" fill="#F59E0B" opacity="0.6"/>

  <!-- Wheels (front trailer) -->
  <circle cx="43" cy="65" r="8.5" fill="#F59E0B"/>
  <circle cx="43" cy="65" r="4"   fill="#0D0F1A"/>
  <circle cx="43" cy="65" r="1.5" fill="#F59E0B" opacity="0.6"/>

  <!-- Wheel (cab) -->
  <circle cx="73" cy="65" r="8.5" fill="#F59E0B"/>
  <circle cx="73" cy="65" r="4"   fill="#0D0F1A"/>
  <circle cx="73" cy="65" r="1.5" fill="#F59E0B" opacity="0.6"/>

  <!-- Ground line -->
  <rect x="5" y="74.5" width="90" height="2.5" rx="1.25" fill="#F59E0B" opacity="0.22"/>
</svg>
